<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Incari Client Theme Configurator</title>
    <style>
        :root {
            --incari-bg: #090a0f;
            --incari-surface: #11131c;
            --incari-border: #1f2336;
            --incari-accent: #00bfff;
            --incari-purple: #8a2be2;
            --text-main: #e2e8f0;
            --text-muted: #64748b;
        }

        body {
            font-family: 'Segoe UI', Roboto, sans-serif;
            background-color: var(--incari-bg);
            color: var(--text-main);
            margin: 0;
            padding: 24px;
            display: grid;
            grid-template-columns: 1fr 450px;
            gap: 24px;
            height: 100vh;
            box-sizing: border-box;
        }

        .panel {
            background-color: var(--incari-surface);
            border: 1px solid var(--incari-border);
            border-radius: 8px;
            padding: 24px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
            position: relative;
            overflow: hidden;
        }

        .panel::before {
            content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px;
            background: linear-gradient(90deg, var(--incari-accent), var(--incari-purple));
        }

        h2 { 
            margin-top: 0; font-size: 1.1rem; text-transform: uppercase; letter-spacing: 1px;
            color: var(--incari-accent); border-bottom: 1px solid var(--incari-border); padding-bottom: 12px; 
        }

        .config-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid rgba(31, 35, 54, 0.5);
        }

        label { font-size: 0.9rem; font-weight: 500; color: var(--text-main); }
        
        input[type="color"] {
            border: none; background: none; width: 44px; height: 32px; cursor: pointer;
        }

        input[type="text"] {
            background: #161924; border: 1px solid var(--incari-border); color: white;
            padding: 8px; border-radius: 4px; width: 100px; text-align: center;
        }

        #json-output {
            flex-grow: 1; background: #06070a; border: 1px solid var(--incari-border);
            border-radius: 6px; padding: 16px; font-family: 'Courier New', Courier, monospace;
            font-size: 0.85rem; color: #39ff14; resize: none; margin-bottom: 16px;
        }

        button {
            background: linear-gradient(135deg, #0070f3, #00bfff); color: white;
            cursor: pointer; border: none; font-weight: bold; padding: 12px;
            text-transform: uppercase; font-size: 0.85rem; letter-spacing: 0.5px;
            border-radius: 6px; transition: all 0.2s;
        }

        button:hover { box-shadow: 0 4px 12px rgba(0, 191, 255, 0.4); transform: translateY(-1px); }
        .success-toast { color: var(--online-green); font-size: 0.85rem; text-align: center; margin-top: 8px; display: none; }
    </style>
</head>
<body>

    <!-- LEFT PANEL: INTERACTIVE THEME MAPPER -->
    <div class="panel">
        <h2>Live UI Configuration Map</h2>
        <div style="overflow-y: auto; flex-grow: 1; padding-right: 8px;">
            <div class="config-row">
                <label>Main Background Color</label>
                <input type="color" id="color-bg" value="#090a0f" oninput="updateThemeJSON()">
            </div>
            <div class="config-row">
                <label>Surface Panels</label>
                <input type="color" id="color-surface" value="#11131c" oninput="updateThemeJSON()">
            </div>
            <div class="config-row">
                <label>Active Accent Glow</label>
                <input type="color" id="color-accent" value="#00bfff" oninput="updateThemeJSON()">
            </div>
            <div class="config-row">
                <label>Secondary Accent Gradient</label>
                <input type="color" id="color-purple" value="#8a2be2" oninput="updateThemeJSON()">
            </div>
            <div class="config-row">
                <label>Text Main Label</label>
                <input type="color" id="color-text" value="#e2e8f0" oninput="updateThemeJSON()">
            </div>
            <div class="config-row">
                <label>Custom Profile Title String</label>
                <input type="text" id="text-title" value="IncariUser" oninput="updateThemeJSON()">
            </div>
        </div>
    </div>

    <!-- RIGHT PANEL: JSON CONFIG EXPORTER -->
    <div class="panel">
        <h2>Incari Client JSON Export</h2>
        <p style="font-size: 0.8rem; color: var(--text-muted); margin-top: 0;">This utility formats valid configurations that can be dropped straight into the client theme module options panels.</p>
        <textarea id="json-output" readonly></textarea>
        <button onclick="copyConfigToClipboard()">Copy Configuration String</button>
        <div id="toast" class="success-toast">✓ Copied! Open Incari Client Theme settings and paste profile configuration.</div>
    </div>

    <script src="app.js"></script>
</body>
</html>
