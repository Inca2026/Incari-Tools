<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Incari Client Hub</title>
    <style>
        :root {
            --incari-bg: #090a0f;
            --incari-surface: #11131c;
            --incari-border: #1f2336;
            --incari-accent: #00bfff;
            --incari-purple: #8a2be2;
            --text-main: #e2e8f0;
            --text-muted: #64748b;
            --online-green: #10b981;
        }

        body {
            font-family: 'Segoe UI', Roboto, sans-serif;
            background-color: var(--incari-bg);
            color: var(--text-main);
            margin: 0;
            padding: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            box-sizing: border-box;
        }

        /* STATE 1: STANDARD INCARI LOGIN WINDOW */
        .login-card {
            background-color: var(--incari-surface);
            border: 1px solid var(--incari-border);
            border-radius: 8px;
            padding: 40px;
            width: 400px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            position: relative;
            display: flex;
            flex-direction: column;
            gap: 18px;
        }
        .login-card::before {
            content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px;
            background: linear-gradient(90deg, var(--incari-accent), var(--incari-purple));
            border-top-left-radius: 8px; border-top-right-radius: 8px;
        }
        .login-card h1 {
            color: var(--incari-accent); margin: 0; font-size: 1.6rem; letter-spacing: 1px; text-transform: uppercase; text-align: center;
        }

        /* STATE 2: ACTIVE DASHBOARD (HIDDEN ON START) */
        #dashboard-view {
            display: none;
            grid-template-columns: 320px 1fr;
            gap: 24px;
            width: 100%;
            height: 100%;
        }

        .panel {
            background-color: var(--incari-surface);
            border: 1px solid var(--incari-border);
            border-radius: 8px;
            padding: 24px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
            position: relative;
        }
        .panel::before {
            content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px;
            background: linear-gradient(90deg, var(--incari-accent), var(--incari-purple));
        }

        h2 { 
            margin-top: 0; font-size: 1.1rem; text-transform: uppercase; letter-spacing: 1px;
            color: var(--incari-accent); border-bottom: 1px solid var(--incari-border); padding-bottom: 12px; 
            display: flex; justify-content: space-between; align-items: center;
        }

        #friends-list { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; overflow-y: auto; }
        .friend-item {
            display: flex; align-items: center; padding: 12px; border-radius: 6px;
            background: rgba(255, 255, 255, 0.02); border: 1px solid transparent;
        }
        .status-dot { width: 8px; height: 8px; border-radius: 50%; margin-right: 12px; background-color: var(--text-muted); }
        .status-dot.online { background-color: var(--online-green); box-shadow: 0 0 10px var(--online-green); }

        #chat-window {
            flex-grow: 1; background: #06070a; border: 1px solid var(--incari-border);
            border-radius: 6px; padding: 16px; font-size: 0.9rem; overflow-y: auto; margin-bottom: 16px;
        }

        .input-group { display: flex; flex-direction: column; gap: 6px; }
        label { font-size: 0.75rem; text-transform: uppercase; color: var(--text-muted); letter-spacing: 0.5px; }

        input[type="text"], input[type="password"] {
            background: #0d0e14; border: 1px solid var(--incari-border); color: white;
            padding: 12px; border-radius: 6px; font-size: 0.9rem; transition: all 0.2s;
        }
        input:focus { outline: none; border-color: var(--incari-accent); }

        button {
            background: linear-gradient(135deg, #0070f3, #00bfff); color: white;
            cursor: pointer; border: none; font-weight: bold; padding: 12px;
            text-transform: uppercase; font-size: 0.85rem; letter-spacing: 0.5px;
            border-radius: 6px; transition: all 0.2s;
        }
        button:hover { box-shadow: 0 4px 12px rgba(0, 191, 255, 0.4); transform: translateY(-1px); }

        .log-user { color: var(--incari-accent); font-weight: bold; }
        .log-system { color: var(--text-muted); font-size: 0.85rem; font-style: italic; }
    </style>
</head>
<body>

    <!-- LOGIN SCREEN -->
    <div id="login-view" class="login-card">
        <h1>Incari Account Login</h1>
        
        <div class="input-group">
            <label>Incari Username</label>
            <input type="text" id="user-field" placeholder="Enter your username...">
        </div>

        <div class="input-group">
            <label>Password</label>
            <input type="password" id="pass-field" placeholder="Enter your password...">
        </div>

        <button onclick="loginAndSync()">Sign In & Sync Friends</button>
    </div>

    <!-- MAIN APP SCREEN -->
    <div id="dashboard-view">
        <!-- Friends list panel -->
        <div class="panel">
            <h2 id="user-header">Logged In User</h2>
            <div id="friends-list">
                <!-- JavaScript syncs friends list here -->
            </div>
            <button style="background: rgba(239, 68, 68, 0.1); color: #ef4444; border: 1px solid rgba(239, 68, 68, 0.2); margin-top: auto;" onclick="disconnectSession()">Log Out</button>
        </div>

        <!-- Chat Panel -->
        <div class="panel">
            <h2>Live Friend Chat</h2>
            <div id="chat-window"></div>
            <div style="display: flex; gap: 12px;">
                <input type="text" id="msg-input" placeholder="Type a message..." style="flex-grow: 1;" onkeydown="if(event.key==='Enter') sendChat()">
                <button onclick="sendChat()" style="padding: 12px 24px;">Send</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
